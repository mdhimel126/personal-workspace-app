<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/game.css">
  
</head>
<body>
    <h1>Let's play a Game</h1>

     <div id="btn">
        <a href="index.html" ><button id="back-btn">Back</button></a>
    </div>

    <h3>Guess the number</h3>

   <div class="parent-div"> 

        <div class="playing-div">
            <p>Drop your digit in the box</p>
            <input class="inpt" type="number">
            <button class="btn">Press</button>
            <p class="my-value"></p>
            <p class="result"></p>
        </div>

        <div class="anss-div">
            <p>Press The button for seeing The result</p>
            <button class="anss-btn">Press</button>
            <p class="show-result"></p>
        </div>

    </div>


    <script src="./src/game.js"> </script>
</body>
</html>
